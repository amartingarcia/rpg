<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#231a2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jaraíz RPG">
  <title>Jaraíz RPG</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="screen">
      <canvas id="game"></canvas>
      <div id="banner"></div>
      <div id="dialog" hidden>
        <div id="dialog-name" hidden></div>
        <div id="dialog-text"></div>
        <div id="dialog-arrow">▼</div>
      </div>
      <div id="fade"></div>
      <div id="title">
        <div class="title-box">
          <div class="title-small">Aventuras en</div>
          <h1>JARAÍZ<br>DE LA VERA</h1>
          <div class="title-pepper">🌶️</div>
        </div>
        <div id="title-start" class="blink">Cargando…</div>
        <div class="title-help">Cruceta para andar · A para hablar · B (mantener) para correr</div>
        <a class="title-3d" href="3d/" onpointerdown="event.stopPropagation()">Probar la plaza en 3D →</a>
      </div>
    </div>
    <div id="pad">
      <div id="dpad" aria-label="Cruceta">
        <div class="arm up"></div><div class="arm down"></div><div class="arm left"></div><div class="arm right"></div><div class="hub"></div>
      </div>
      <div id="ab">
        <button id="btnB" aria-label="B">B</button>
        <button id="btnA" aria-label="A">A</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
